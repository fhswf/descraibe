[project]
name = "audiodeskription-webapp"
version = "1.0.0"
description = "Audiodeskription pipeline web application"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi>=0.100.0",
    "uvicorn>=0.30.0",
    "python-multipart>=0.0.31",
    # Pipeline dependencies (same as notebook)
    "moviepy>=2.2",
    "torch==2.12.1",
    "facenet-pytorch",
    "torchaudio",
    "pyarrow",
    "soundfile",
    "faster-whisper>=1.0",
    "scenedetect>=0.6",
    "pandas",
    "numpy",
    "opencv-python-headless",
    "openai>=1.0",
    "pyphen",
    "tqdm",
    "pyyaml",
    "python-dotenv>=1.2.2",
    "authlib>=1.4.0",
    "itsdangerous>=2.2.0",
    "psycopg[binary]>=3.2.0",
    # Person analysis dependencies
    "pytesseract>=0.3.10",
    "rfdetr==1.9.2",
    "trackers==2.5.0.post0",
    "uniface[gpu]==3.7.1",
    "onnxruntime-gpu==1.27.0",
    "torchvision==0.27.1",
    "timm==0.4.12",
]

[project.scripts]
webapp = "backend.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.pytest.ini_options]
pythonpath = ["."]   # makes `import backend.session_manager` work
testpaths  = ["tests"]

[tool.uv]
exclude-dependencies = [
    "onnxruntime",
]

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }
