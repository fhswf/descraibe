server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── Long-lived cache for content-hashed assets ────────────────────────────
    # Vite appends a content hash to all JS/CSS filenames (e.g. index-Bx3k9q2a.js),
    # so these can be cached indefinitely.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── SPA fallback ──────────────────────────────────────────────────────────
    # For any path that doesn't match a real file, serve index.html so that
    # React Router can handle client-side routing.
    location / {
        try_files $uri $uri/ /index.html;

        # Prevent the browser from caching index.html itself, so a new deploy
        # is picked up immediately without a hard refresh.
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # ── Security headers ──────────────────────────────────────────────────────
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
