# ArgoCD Application manifest for the Audiodeskription webapp.
#
# Apply this once to your ArgoCD namespace (not to the app namespace):
#   kubectl apply -f k8s/argocd-app.yaml -n argocd
#
# After applying, ArgoCD will sync the k8s/ directory and create all resources
# (Namespace, ConfigMaps, Secret placeholder, PVC, Deployment, Service, Ingress).
#
# Pre-requisites:
#   1. Set your real OpenAI API key in the `openai-secret` Secret
#      (use External Secrets Operator or Vault instead of committing it).
#   2. Replace REPO_URL, TARGET_REVISION, and the domain in k8s/ingress.yaml.
#   3. Replace the image tag in k8s/deployment.yaml and k8s/kustomization.yaml.
#
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: audiodeskription
  namespace: argocd          # always deploy the Application object into the argocd namespace
  labels:
    app.kubernetes.io/name: audiodeskription
spec:
  project: default

  source:
    repoURL: https://github.com/YOUR_ORG/Audiodeskriptionen_SS25   # ← replace
    targetRevision: main                                            # ← branch / tag / SHA
    path: k8s                                                       # Kustomize root

  destination:
    server: https://kubernetes.default.svc
    namespace: audiodeskription

  syncPolicy:
    automated:
      prune: true       # delete resources removed from git
      selfHeal: true    # revert manual changes in the cluster
    syncOptions:
      - CreateNamespace=true          # create the namespace if it doesn't exist
      - ServerSideApply=true          # required for large ConfigMaps (prompt files)
      - PrunePropagationPolicy=foreground
