apiVersion: apps/v1
kind: Deployment
metadata:
  name: audiodeskription-backend
  namespace: audiodeskription
  labels:
    app.kubernetes.io/name: audiodeskription
    app.kubernetes.io/component: backend
spec:
  replicas: 1     # Keep replicas=1: the pipeline holds per-job in-memory state.
                  # Scale-out requires externalizing state (e.g. Redis + shared PVC).
  # Avoid rollout deadlocks with scarce MIG resources:
  # terminate old pod first, then schedule the new one.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: audiodeskription-backend
  template:
    metadata:
      labels:
        app: audiodeskription-backend
        app.kubernetes.io/name: audiodeskription
        app.kubernetes.io/component: backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/fhswf/descraibe/audiodeskription-backend:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 5000
              protocol: TCP
          # ── Environment ──────────────────────────────────────────────────────
          env:
            # GPT config path: the ConfigMap is mounted as a file at /app/config/
            - name: GPT_CONFIG_PATH
              value: /app/config/gpt_config.yaml
            # Prompt templates dir: the prompts ConfigMap is mounted at /app/config/prompts/
            # The app assembles system_instruction + ad_rules [+ few_shots] → SYSTEM_FINAL
            # and uses user_instruction as USER_BASE when no explicit prompts are in the request.
            - name: GPT_PROMPTS_DIR
              value: /app/config/prompts
            # Standard gunicorn/app tuning
            - name: AD_JOBS_DIR
              value: /app/jobs
            - name: MAX_UPLOAD_MB
              value: "4096"
            - name: UVICORN_WORKERS
              value: "1"
            # Optional PostgreSQL DSN from CNPG generated app secret.
            # When unset, the backend falls back to file-based user config storage.
            - name: AD_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: descraibe-db-app
                  key: uri
                  optional: true
          # OpenAI API key and base URL injected from Secret.
          # OPENAI_API_KEY  – bearer token for the LLM endpoint
          # OPENAI_BASE_URL – OpenAI-compatible endpoint (e.g. https://hub.ki.fh-swf.de/v1)
          envFrom:
            - secretRef:
                name: openai-secret
          # ── Volume mounts ────────────────────────────────────────────────────
          volumeMounts:
            - name: jobs
              mountPath: /app/jobs
            - name: gpt-config
              mountPath: /app/config
              readOnly: true
            - name: prompts-config
              mountPath: /app/config/prompts
              readOnly: true
          # ── Resources ────────────────────────────────────────────────────────
          resources:
            requests:
              nvidia.com/mig-3g.40gb: "1"
              cpu: "2"
              memory: "8Gi"
            limits:
              nvidia.com/mig-3g.40gb: "1"
              cpu: "4"
              memory: "32Gi"
          # ── Probes ───────────────────────────────────────────────────────────
          livenessProbe:
            httpGet:
              path: /api/ping
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/ping
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
      # ── Volumes ──────────────────────────────────────────────────────────────
      volumes:
        - name: jobs
          persistentVolumeClaim:
            claimName: audiodeskription-jobs
        - name: gpt-config
          configMap:
            name: gpt-config
        - name: prompts-config
          configMap:
            name: prompts-config
