apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  # Kustomize adds the staging suffix to resource names.
  name: descraibe-db-app-user
  labels:
    app.kubernetes.io/name: audiodeskription
    app.kubernetes.io/component: database
spec:
  encryptedData:
    username: 
    password: 
  template:
    metadata:
      # Keep explicit final secret name to match patched Cluster spec.
      name: descraibe-db-app-user-staging
      namespace: audiodeskription-staging
      labels:
        app.kubernetes.io/name: audiodeskription
        app.kubernetes.io/component: database
    type: kubernetes.io/basic-auth
