apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

nameSuffix: -staging
namespace: audiodeskription-staging

configMapGenerator:
  - name: oidc-config
    literals:
      - OIDC_ISSUER_URL=https://keycloak.ki.fh-swf.de/realms/public
      - OIDC_CLIENT_ID=fh-swf-cloud
      - OIDC_COOKIE_SECURE="true"
      - OIDC_REDIRECT_URI=https://descraibe.gawron.cloud/api/auth/callback


resources:
  - ../../base
  - openai-sealedsecret.yaml
  - cnpg-sealedsecret.yaml
  - oidc-sealedsecret.yaml

# Bootstrap values. After every successful push to main, CI replaces both tags
# with the immutable sha-* tag that it just built and commits the change.
images:
  - name: ghcr.io/fhswf/descraibe/audiodeskription-backend
    newTag: sha-2f8a405
  - name: ghcr.io/fhswf/descraibe/audiodeskription-frontend
    newTag: sha-2f8a405

patches:
  - target:
      kind: Ingress
      name: audiodeskription
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: descraibe.gawron.cloud
  - target:
      kind: Deployment
      name: audiodeskription-backend
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/envFrom/0/secretRef/name
        value: openai-secret-staging
      - op: add
        path: /spec/template/spec/containers/0/envFrom/-
        value:
          secretRef:
            name: oidc-secret-staging
      - op: add
        path: /spec/template/spec/containers/0/envFrom/-
        value:
          configMapRef:
            name: oidc-config-staging
  - target:
      kind: Deployment
      name: audiodeskription-backend
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: audiodeskription-backend
      spec:
        template:
          spec:
            containers:
              - name: backend
                env:
                  - name: AD_DATABASE_URL
                    valueFrom:
                      secretKeyRef:
                        name: descraibe-db-staging-app
                        key: uri
                        optional: true
  - target:
      kind: Cluster
      name: descraibe-db
    patch: |-
      - op: replace
        path: /spec/bootstrap/initdb/secret/name
        value: descraibe-db-app-user-staging
      - op: replace
        path: /spec/superuserSecret/name
        value: descraibe-db-superuser-staging
