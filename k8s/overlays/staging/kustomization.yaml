apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

nameSuffix: -staging
namespace: audiodeskription-staging

resources:
  - ../../base
  - openai-sealedsecret.yaml

# Bootstrap values. After every successful push to main, CI replaces both tags
# with the immutable sha-* tag that it just built and commits the change.
images:
  - name: ghcr.io/fhswf/descraibe/audiodeskription-backend
    newTag: sha-cad1a46
  - name: ghcr.io/fhswf/descraibe/audiodeskription-frontend
    newTag: sha-cad1a46

patches:
  - target:
      kind: Ingress
      name: audiodeskription
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: descraibe.gawron.cloud
  - target:
      kind: Deployment
      name: audiodeskription-backend
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/envFrom/0/secretRef/name
        value: openai-secret-staging
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: OIDC_ISSUER_URL
          value: https://keycloak.ki.fh-swf.de/realms/public
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: OIDC_CLIENT_ID
          value: fh-swf-cloud
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: OIDC_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: openai-secret-staging
              key: OIDC_CLIENT_SECRET
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: OIDC_SESSION_SECRET
          valueFrom:
            secretKeyRef:
              name: openai-secret-staging
              key: OIDC_SESSION_SECRET
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: OIDC_COOKIE_SECURE
          value: "true"
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: OIDC_REDIRECT_URI
          value: https://descraibe.gawron.cloud/api/auth/callback
