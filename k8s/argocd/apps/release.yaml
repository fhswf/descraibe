apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: audiodeskription-release
  namespace: argocd
  annotations:
    notifications.argoproj.io/subscribe.on-deployed.github: ""
    link.argocd.argoproj.io/external-link: "https://descraibe.fh-swf.cloud"
  labels:
    app.kubernetes.io/name: audiodeskription
    app.kubernetes.io/component: webapp
    app.kubernetes.io/part-of: audiodeskription
    environment: release
spec:
  project: default

  source:
    repoURL: git@github.com:fhswf/Audiodeskriptionen_SS25.git
    targetRevision: main
    path: webapp/k8s/overlays/release

  destination:
    server: https://kubernetes.default.svc
    namespace: audiodeskription

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - PrunePropagationPolicy=foreground
