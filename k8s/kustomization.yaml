# kustomization.yaml – ArgoCD-friendly entrypoint
# ArgoCD Application should point to this directory with:
#   spec.source.repoURL: <your-repo>
#   spec.source.path: k8s
#   spec.source.targetRevision: main
#
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: audiodeskription

resources:
  - namespace.yaml
  - pvc.yaml
  - configmap-gpt-yaml.yaml
  - configmap-prompts.yaml
  - secret.yaml          # ⚠ Replace with External Secrets / Vault in production
  - deployment.yaml
  - service.yaml
  - ingress.yaml

# ── Image overrides ──────────────────────────────────────────────────────────
# ArgoCD Image Updater or CI can update the newTag field automatically.
images:
  - name: ghcr.io/YOUR_ORG/audiodeskription-webapp
    newTag: latest         # ← override per environment or let Image Updater manage this
