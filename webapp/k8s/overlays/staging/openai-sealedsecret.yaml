apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  # Kustomize adds the staging suffix, so the final SealedSecret and Secret
  # name is openai-secret-staging in namespace audiodeskription-staging.
  name: openai-secret
  labels:
    app.kubernetes.io/name: audiodeskription
    app.kubernetes.io/component: credentials
spec:
  encryptedData:
    # Replace with a value sealed for:
    #   name: openai-secret-staging
    #   namespace: audiodeskription-staging
    OPENAI_API_KEY: 
    metadata:
      name: openai-secret-staging
      namespace: audiodeskription-staging
      labels:
        app.kubernetes.io/name: audiodeskription
        app.kubernetes.io/component: credentials
    type: Opaque
