apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

nameSuffix: -staging
namespace: audiodeskription-staging

resources:
  - ../../base
  - openai-sealedsecret.yaml

# Bootstrap value. After every successful push to main, CI replaces this with
# the immutable sha-* image tag that it just built and commits the change.
images:
  - name: ghcr.io/fhswf/audiodeskription-webapp
    newTag: sha-489e4a8

patches:
  - target:
      kind: Ingress
      name: audiodeskription
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: descraibe.gawron.cloud
  - target:
      kind: Deployment
      name: audiodeskription
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/envFrom/0/secretRef/name
        value: openai-secret-staging
