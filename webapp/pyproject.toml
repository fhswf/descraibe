[project]
name = "audiodeskription-webapp"
version = "0.6.0"
description = "Audiodeskription pipeline web application"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "flask>=3.0",
    "flask-cors>=4.0",
    # Pipeline dependencies (same as notebook)
    "moviepy>=2.0",
    "torch",
    "torchaudio",
    "pyarrow",
    "soundfile",
    "faster-whisper>=1.0",
    "scenedetect>=0.6",
    "pandas",
    "numpy",
    "opencv-python-headless",
    "openai>=1.0",
    "pyphen",
    "tqdm",
    "pyyaml",
]

[project.scripts]
webapp = "backend.app:main"

[tool.uv]
# Use the PyTorch CUDA index for GPU-accelerated torch builds.
# Switch to "cpu" or remove the override for a CPU-only image.
# index-url = "https://download.pytorch.org/whl/cu121"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.pytest.ini_options]
pythonpath = ["."]   # makes `import backend.session_manager` work
testpaths  = ["tests"]
