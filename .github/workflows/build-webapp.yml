name: Build & Push Webapp Container

on:
  pull_request:
    types: [closed]
    branches: [main]
    paths:
      - "webapp/**"
  push:
    tags:
      - "v*.*.*"          # e.g. v1.2.3  → triggers a versioned release build
    paths:
      - "webapp/**"
  workflow_call:
    inputs:
      release_tag:
        description: 'Tag to apply to the image (e.g. v1.0.0)'
        required: false
        type: string
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional: version tag to apply to the image (e.g. v0.18.0)'
        required: false
        type: string

concurrency:
  # Use a more descriptive group name. 
  # For release-please calls, use the tag name if available to avoid cancellation by a push build.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/audiodeskription-webapp

jobs:
  build:
    # Skip if this is a PR event but it wasn't merged.
    # Also skip if this is a push event (not a tag) and the commit message is a release-please commit (though we removed push: main, tags still trigger)
    if: |
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true) ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) ||
      (github.event_name == 'workflow_dispatch') ||
      (github.event_name == 'workflow_call')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # needed to push to ghcr.io

    steps:

      # ── Checkout ──────────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Set up Docker Buildx (multi-platform + layer cache support) ───────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── Log in to GitHub Container Registry ───────────────────────────────────
      # Skipped for pull-request builds (no GITHUB_TOKEN write access needed)
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Derive image tags & labels (OCI standard) ─────────────────────────────
      # docker/metadata-action handles:
      #   • branch pushes  → :latest  +  :<sha>
      #   • semver tags    → :1.2.3   +  :1.2  +  :1  +  :latest
      #   • pull requests  → :pr-<n>  (not pushed)
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
            type=raw,value=${{ inputs.release_tag }},enable=${{ inputs.release_tag != '' }}

      # ── Build (and push on non-PR events) ─────────────────────────────────────
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: webapp/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Use GitHub Actions cache to speed up repeat builds
          cache-from: type=gha
          cache-to: type=gha,mode=min
