name: Build & Push Webapp Container

on:
  push:
    branches:
      - main              # merged PRs, including Dependabot security updates, update staging
    tags:
      - "v*.*.*"          # e.g. v1.2.3  → triggers a versioned release build
    paths:
      - "webapp/**"
  workflow_call:
    inputs:
      release_tag:
        description: 'Tag to apply to the image (e.g. v1.0.0)'
        required: false
        type: string
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional: version tag to apply to the image (e.g. v0.18.0)'
        required: false
        type: string

concurrency:
  # Use a more descriptive group name. 
  # For release-please calls, use the tag name if available to avoid cancellation by a push build.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/audiodeskription-webapp

jobs:
  build:
    # Pushes to main publish the staging image; tags publish release images.
    if: |
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))) ||
      (github.event_name == 'workflow_dispatch') ||
      (github.event_name == 'workflow_call')
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to update the staging overlay with the built sha tag
      packages: write   # needed to push to ghcr.io

    steps:

      # ── Checkout ──────────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Set up Docker Buildx (multi-platform + layer cache support) ───────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── Log in to GitHub Container Registry ───────────────────────────────────
      # Required for image pushes and for exporting the BuildKit registry cache.
      # This job only runs for merged PRs, tags, manual dispatches, or workflow calls.
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Derive image tags & labels (OCI standard) ─────────────────────────────
      # docker/metadata-action handles:
      #   • main pushes    → :staging +  :<sha> (overlay is pinned to :<sha>)
      #   • semver tags    → :1.2.3   +  :1.2  +  :1  +  :latest
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-,format=short
            type=raw,value=staging,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=raw,value=${{ inputs.release_tag }},enable=${{ inputs.release_tag != '' }}

      # ── Build and push ────────────────────────────────────────────────────────
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: webapp/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_APP_BUILD_CHANNEL=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && 'staging' || '' }}
            VITE_APP_COMMIT_SHA=${{ github.sha }}
            VITE_APP_REPOSITORY_URL=${{ github.server_url }}/${{ github.repository }}
          # Use the registry as a cache backend (much faster for large layers in GHCR)
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max

      # ── Pin staging overlay to the immutable image tag ───────────────────────
      - name: Update staging overlay image tag
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA::7}"
          tag="sha-${short_sha}"
          file="webapp/k8s/overlays/staging/kustomization.yaml"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            git fetch origin main
            git switch -C main FETCH_HEAD

            sed -i -E "s/newTag: .*/newTag: ${tag}/" "$file"

            if git diff --quiet -- "$file"; then
              echo "Staging overlay already points to ${tag}."
              exit 0
            fi

            git add "$file"
            git commit -m "chore: pin staging webapp image to ${tag} [skip ci]"

            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Push was rejected because main advanced; retrying (${attempt}/3)."
          done

          echo "Failed to update staging overlay after 3 attempts."
          exit 1
